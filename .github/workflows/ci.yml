name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Python bağımlılıkları (kilit dosyası güncel olmalı)
        run: uv sync --locked

      - name: Kod denetimi
        run: uv run python -m ruff check .

      - name: Arayüz bağımlılıkları
        run: npm --prefix web ci --no-fund --no-audit

      - name: Arayüz kod denetimi (eslint)
        run: npm --prefix web run lint

      - name: Arayüz birim testleri (vitest)
        run: npm --prefix web test

      - name: Arayüzü derle (tür denetimi dahil)
        run: npm --prefix web run build

      # Edge çalıştırıcıda hazır: Markdown/HTML baskısı ve arayüz testleri koşar. LibreOffice,
      # Tesseract ve Ghostscript kurulu değil: onları isteyen testler atlanır.
      - name: Testler
        run: uv run python -m pytest --tb=short -rs

  # Masaüstü paketi (motorsuz: CI'da Tesseract/Ghostscript yok). Paket kendi Python'uyla
  # denenir (bağımlılıklar yükleniyor mu, arayüz ve fontlar pakette mi) ve artifact olarak
  # yüklenir. Arkadaşlara verilecek tam paket (OCR dahil) yerelde `paket/derle.py` ile üretilir.
  paket:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Arayüzü derle
        run: |
          npm --prefix web ci --no-fund --no-audit
          npm --prefix web run build

      - name: Paketi üret ve dene
        run: uv run python paket/derle.py --motorsuz

      - uses: actions/upload-artifact@v4
        with:
          name: PdfAtolyesi-motorsuz
          path: build/PdfAtolyesi-*.zip
          retention-days: 14
