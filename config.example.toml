# PDF Atölyesi ayarları. Bu dosyayı config.toml olarak kopyala.
# Yazmadığın her ayar varsayılan değeriyle kalır. Uygulamanın Ayarlar ekranı da bu dosyaya yazar
# (saklama süresi, kasa, varsayılan tema/kağıt, port, telefon modu); elle yazılan açıklamalar o
# zaman kaybolur.

# host = "127.0.0.1"        # başka bir değer reddedilir; telefon modu için lan = true ya da --lan
# lan = false               # telefon modu: aynı Wi-Fi'den QR kodla eşleşen cihazlar bağlanır
# port = 8790
# data_dir = "%LOCALAPPDATA%\\PdfAtolye"
# retention_hours = 24      # bu süreden eski, sabitlenmemiş dosyalar silinir
# max_upload_mb = 8192      # dosya başına üst sınır (8 GB)
# max_request_mb = 16384    # tek seferde yüklenen dosyaların toplamı (16 GB)
# vault_path = "C:\\Users\\ben\\Documents\\ObsidianKasam"   # MD → PDF'te ![[resim]] için
# default_theme = "ders"    # MD → PDF varsayılanı: ders | rapor | sade
# default_paper = "A4"      # A4 | A5 | A3 | A2 | A1 | A0 | Letter | Legal
# open_browser = true

[engines]
# Boş bırakılırsa otomatik bulunur.
# libreoffice = "C:\\Program Files\\LibreOffice\\program\\soffice.com"
# tesseract   = "C:\\Program Files\\Tesseract-OCR\\tesseract.exe"
# ghostscript = "C:\\Program Files\\gs\\gs10.05.1\\bin\\gswin64c.exe"
# browser     = "C:\\Program Files (x86)\\Microsoft\\Edge\\Application\\msedge.exe"
