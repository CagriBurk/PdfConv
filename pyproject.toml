[project]
name = "pdfatolye"
version = "0.9.0"
description = "Yerel, çevrimdışı PDF araç seti"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "typer>=0.12",
    "pymupdf>=1.25",
    "pikepdf>=9.4",
    "psutil>=6.1",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "pygments>=2.21.0",
    "playwright>=1.64.1",
    "pyyaml>=6.0.3",
    "fonttools>=4.55",
    "ocrmypdf>=16",
    "qrcode>=8.0",
]

[project.scripts]
pdfatolye = "pdfatolye.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdfatolye"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
